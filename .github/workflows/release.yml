name: Build & Release

# 触发策略（1.1.0 起改为纯手动触发）：
# - 只支持 workflow_dispatch（在 GitHub Actions 界面手动点 "Run workflow"）。
# - 去掉了 push 到 main 的编译验证触发和 push tag 的自动发布触发——发版是
#   "确认这版可以发了"的显式动作，应该由人手动执行，避免误触发产生无意义的
#   Release 或在代码改一半时意外触发编译验证。
#
# 手动触发后的完整流程：
# 1. build job：编译 + 跑测试，验证 jar 和 sources jar 都已生成，上传为 artifact
# 2. release job：下载 artifact，从 gradle.properties 读版本号，检查对应 tag
#    不存在（防重复发布），从 README 更新日志提取 Release Notes，创建 GitHub
#    Release 并自动打 v*.*.* tag，上传 jar + sources jar 作为附件
#
# 发版前需确保：
# (1) gradle.properties 的 mod_version 已更新到要发布的版本号
# (2) README "八、更新日志" 里有对应版本号的条目（提取不到会让 workflow 失败）
# (3) 代码已 commit 并 push 到远程 main 分支（workflow 基于触发时选择的分支构建）
#
# 历史决策：0.16.4 起曾改为"GitHub Release 只含源码，jar 统一走 Modrinth"，
# 并配合 release.py 脚本自动打 tag 触发。1.1.0 改回 GitHub Release 也带 jar +
# sources jar，并改为纯手动触发 + 删除 release.py——理由是手动触发更直观、
# 不会误发；jar 附在 Release 上方便玩家多渠道下载（Modrinth 仍由作者手动上传
# 作为主渠道）。早期版本（0.8.0~0.16.3）的旧 workflow 会编译并把 jar 作为
# Release 附件上传，那批旧 Release 里仍然有历史版本的 jar。
on:
  workflow_dispatch

# 手动触发的发布流程不取消进行中的运行——发布是重要操作，误取消可能导致
# Release 创建了一半被中断（tag 打了但 jar 没传上去），排查起来很麻烦。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle Wrapper 本身不在仓库里（见 README "关于 Gradle Wrapper" 一节：
      # 二进制 wrapper jar 无法在无网络沙盒环境里可靠生成）。CI 环境有网络、
      # 也不需要"仓库自带 wrapper"这个约束，所以直接用 setup-gradle 官方
      # action 提供的 gradle 命令构建，不用先生成 wrapper 再切换——减少一步
      # 可能出错的环节，且效果等价（gradle-wrapper.properties 已经锁定了
      # 8.8，这里 gradle-version 也显式指定 8.8，两边保持一致）。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build with Gradle
        run: gradle build --stacktrace

      # 验证编译产物存在，并把版本号/文件路径暴露给后续步骤使用。
      # build.gradle 配置了 withSourcesJar()，所以 build/libs/ 下会有：
      #   <name>-<version>.jar          编译好的模组 jar（玩家直接放进 mods/）
      #   <name>-<version>-sources.jar  源码 jar（供 IDE 查看源码 / 调试用）
      # 这个检查能在"编译看似成功但产物没生成"的边缘情况下（比如 build.gradle
      # 的 archivesName 配置错了）及时暴露问题，而不等到上传 Release 时才发现。
      - name: Verify built jars exist
        id: jars
        run: |
          BASE_NAME=$(grep '^archives_base_name=' gradle.properties | cut -d= -f2)
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          JAR_NAME="${BASE_NAME}-${MOD_VERSION}.jar"
          SOURCES_JAR_NAME="${BASE_NAME}-${MOD_VERSION}-sources.jar"
          if [ ! -f "build/libs/${JAR_NAME}" ]; then
            echo "::error::期望的构建产物 build/libs/${JAR_NAME} 不存在，实际内容："
            ls -la build/libs/
            exit 1
          fi
          if [ ! -f "build/libs/${SOURCES_JAR_NAME}" ]; then
            echo "::error::期望的源码 jar build/libs/${SOURCES_JAR_NAME} 不存在，实际内容："
            ls -la build/libs/
            exit 1
          fi
          echo "version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "编译验证通过：${JAR_NAME} 和 ${SOURCES_JAR_NAME} 均已生成。"

      # 把 jar 和 sources jar 上传为 artifact，供 release job 下载后附到 Release。
      # build 和 release 是两个独立的 job，运行在不同的 runner 上，不能直接共享
      # 文件系统，必须通过 artifact 中转。retention-days=1 是因为发布完成后
      # artifact 就没用了（jar 已经附在 Release 上），不需要长期占用存储。
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-jars
          path: |
            build/libs/*.jar
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 和自动打 tag 都需要仓库写权限
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载 build job 上传的 jar 和 sources jar 到 build/libs/ 目录，
      # 路径和构建时一致，方便后面用 glob 模式 build/libs/*.jar 统一上传。
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-jars
          path: build/libs/

      - name: Read version from gradle.properties
        id: version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${MOD_VERSION}" >> "$GITHUB_OUTPUT"

      # 防呆检查：对应的 v*.*.* tag 不能已存在，否则 softprops/action-gh-release
      # 会在已有 Release 上追加文件或报错，造成版本混乱。如果要重新发布同一版本，
      # 需要先手动删除旧 tag 和旧 Release，这个操作不自动化是为了防止误删。
      - name: Check tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "::error::tag ${TAG} 已存在。如果要重新发布该版本，请先手动删除："
            echo "  git tag -d ${TAG} && git push origin :refs/tags/${TAG}"
            echo "并在 GitHub Releases 页面删除对应的旧 Release。"
            exit 1
          fi
          echo "tag ${TAG} 不存在，可以继续发布。"

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -e
          python3 .github/scripts/extract_changelog.py "${{ steps.version.outputs.version }}" README.md > changelog_body.md
          echo "已提取到以下更新日志内容："
          cat changelog_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # tag_name 指定的 tag 不存在时，action-gh-release 会在当前 commit
          # （workflow 触发时选择的分支的最新 commit）上自动创建该 tag。
          # 这样就不需要本地手动打 tag 或维护 release.py 脚本了。
          tag_name: ${{ steps.version.outputs.tag }}
          name: MCCF ${{ steps.version.outputs.tag }}
          body_path: changelog_body.md
          # Release 附件：
          # 1. 编译好的 jar（玩家直接放进 mods 文件夹就能用）
          # 2. sources jar（供开发者在 IDE 里查看源码 / 调试反编译用）
          # 3. GitHub 自动生成的源码 zip/tar（无需手动上传，GitHub 会自动附上）
          # Modrinth 的 jar 上传由作者手动操作，两个渠道都有 jar，Modrinth 是主渠道。
          files: |
            build/libs/*.jar
          # 版本号里带 -alpha/-beta/-rc 等后缀的 tag 自动标记为预发布；
          # 纯 x.y.z 格式（当前项目一直是这种）标记为正式发布。
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          draft: false
